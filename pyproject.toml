[project]
name = "projet-dl"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "matplotlib>=3.8",
    "notebook>=7.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pandas>=2.2",
    "pillow>=10.2",
    "pyqt5>=5.15.11",
    "scikit-learn>=1.4",
    "seaborn>=0.13",
    "tensorflow>=2.16,<2.21",
    "tqdm>=4.66",
    "ultralytics>=8.2",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
